name: Build Server Image

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend_app/**'
      - 'frontend_admin/**'
      - '.github/workflows/build-server-image.yml'
  push:
    branches: [ main ]
    tags:
      - 'v*'
    paths:
      - 'backend/**'
      - 'frontend_app/**'
      - 'frontend_admin/**'
      - '.github/workflows/build-server-image.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Publish as this release tag (e.g. v0.3.33) and update `latest`.
          Must match the version in backend/Cargo.toml. Leave empty for a
          plain sha-tagged build.
        required: false
        default: ''

# Each architecture is built on a runner of that architecture and pushed by
# digest; a second job then joins the digests into one multi-arch tag. The
# alternative — one amd64 runner emulating arm64 through QEMU — compiles the
# Rust backend under emulation and takes the better part of an hour.
#
# Images go to two registries. Docker Hub is what the guided installer in
# scripts/publish_dockerhub/ and the default docker-compose.yml pull from, so
# it is the one most self-hosters actually use; GHCR is what the README and
# release notes reference. Both get the same digests. A fork without the
# Docker Hub secrets publishes to GHCR alone rather than failing.
jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute image coordinates
        id: image
        shell: bash
        run: |
          echo "ghcr=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mindmapvault-server" >> "$GITHUB_OUTPUT"
          echo "slug=${MATRIX_PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
        env:
          MATRIX_PLATFORM: ${{ matrix.platform }}

      # Only used for the OCI labels baked into the image; the tags that get
      # published are worked out in the merge job.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.ghcr }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull requests validate that the image still builds, and push nothing.
      - name: Build only (pull request)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha,scope=${{ steps.image.outputs.slug }}
          cache-to: type=gha,mode=max,scope=${{ steps.image.outputs.slug }}

      # Pushed by digest to GHCR only. The merge job copies the finished
      # manifest across to Docker Hub, so each architecture is uploaded once
      # rather than once per registry.
      - name: Build and push by digest
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.image.outputs.ghcr }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.image.outputs.slug }}
          cache-to: type=gha,mode=max,scope=${{ steps.image.outputs.slug }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.image.outputs.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: publish multi-arch tags
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' backend/Cargo.toml | head -n1)"
          if [ -z "$version" ]; then
            echo "Failed to read backend version from backend/Cargo.toml" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      # A release is either a pushed v* tag, or a manual run naming one. The
      # manual path exists so a release can be republished — to a registry that
      # was not wired up when it was cut, say — without moving the git tag.
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          REQUESTED: ${{ inputs.release_tag }}
          VERSION: ${{ steps.app_version.outputs.value }}
        run: |
          if [ -n "$REQUESTED" ]; then
            # Guard against publishing the wrong commit under a release tag:
            # the checked-out code has to be the version being claimed.
            if [ "$REQUESTED" != "v${VERSION}" ]; then
              echo "Requested $REQUESTED but backend/Cargo.toml says v${VERSION}." >&2
              echo "Check out the matching commit, or correct the version." >&2
              exit 1
            fi
            echo "tag=$REQUESTED" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute image coordinates
        id: image
        shell: bash
        env:
          DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_NAMESPACE }}
        run: |
          ghcr="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mindmapvault-server"
          echo "ghcr=$ghcr" >> "$GITHUB_OUTPUT"

          if [ -n "$DOCKERHUB_NAMESPACE" ]; then
            namespace="${DOCKERHUB_NAMESPACE,,}"
            dockerhub="docker.io/${namespace}/mindmapvault-server"
            echo "dockerhub=$dockerhub" >> "$GITHUB_OUTPUT"
            echo "dockerhub_enabled=true" >> "$GITHUB_OUTPUT"
            printf 'images<<IMAGES_EOF\n%s\n%s\nIMAGES_EOF\n' "$ghcr" "$dockerhub" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::DOCKERHUB_NAMESPACE is not set; publishing to GHCR only."
            echo "dockerhub_enabled=false" >> "$GITHUB_OUTPUT"
            printf 'images<<IMAGES_EOF\n%s\nIMAGES_EOF\n' "$ghcr" >> "$GITHUB_OUTPUT"
          fi

      # Version tags and `latest` belong to releases. A push to main publishes
      # only its sha tag, so `latest` keeps meaning "newest release" rather than
      # "newest commit".
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.images }}
          tags: |
            type=ref,event=tag
            type=raw,value=${{ steps.release.outputs.tag }},enable=${{ steps.release.outputs.is_release == 'true' }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ steps.release.outputs.is_release == 'true' }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.image.outputs.dockerhub_enabled == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # One command per target registry. imagetools copies the blobs across
      # from GHCR when the target is Docker Hub.
      - name: Create manifest list and push
        working-directory: /tmp/digests
        shell: bash
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.image.outputs.ghcr }}@sha256:%s ' *)

      # Proves the tags resolve and are multi-arch before anyone pulls them.
      - name: Verify published tags
        shell: bash
        run: |
          failed=0
          while read -r tag; do
            [ -n "$tag" ] || continue
            echo "── $tag"
            if ! platforms="$(docker buildx imagetools inspect --raw "$tag" \
                | jq -r '.manifests[]? | select(.platform.os != "unknown") | .platform.os + "/" + .platform.architecture' \
                | sort | tr '\n' ' ')"; then
              echo "::error::Could not inspect $tag"
              failed=1
              continue
            fi
            echo "   $platforms"
            for want in linux/amd64 linux/arm64; do
              case "$platforms" in
                *"$want"*) ;;
                *) echo "::error::$tag is missing $want"; failed=1 ;;
              esac
            done
          done <<< "${{ steps.meta.outputs.tags }}"
          exit "$failed"

      - name: Publish usage summary
        shell: bash
        run: |
          {
            echo "## Server Image"
            echo ""
            echo "Platforms: \`linux/amd64\`, \`linux/arm64\` (each built on a native runner)."
            echo ""
            echo "| Registry | Image |"
            echo "| --- | --- |"
            echo "| GHCR | \`${{ steps.image.outputs.ghcr }}\` |"
            if [ "${{ steps.image.outputs.dockerhub_enabled }}" = "true" ]; then
              echo "| Docker Hub | \`${{ steps.image.outputs.dockerhub }}\` |"
            else
              echo "| Docker Hub | not configured (\`DOCKERHUB_NAMESPACE\` unset) |"
            fi
            echo ""
            echo "Pushed tags:"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
