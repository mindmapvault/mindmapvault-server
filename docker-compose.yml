services:
  postgres:
    image: postgres:16-bookworm
    container_name: mindmapvault-server-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mindmapvault
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.deploy}
    # Bound to localhost on purpose: Docker's published ports bypass ufw-style
    # host firewalls, so 0.0.0.0 would expose the database to the network.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mindmapvault"]
      interval: 10s
      timeout: 5s
      retries: 10

  garage:
    image: dxflrs/garage:v2.3.0
    container_name: mindmapvault-server-garage
    restart: unless-stopped
    command: /garage server --single-node --default-bucket
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env.deploy}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env.deploy}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_BUCKET:-mindmapvault}
    # Same localhost-only binding as postgres; only the server's 8090 is public.
    ports:
      - "127.0.0.1:9000:3900"
      - "127.0.0.1:3901:3901"
      - "127.0.0.1:3903:3903"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    # Pin a version for production, e.g. kornelko2/mindmapvault-server:v0.3.33.
    # ghcr.io/mindmapvault/mindmapvault-server carries the same digests if you
    # prefer GHCR. See docs/DEPLOYMENT.md#published-images.
    image: ${SERVER_IMAGE:-kornelko2/mindmapvault-server:latest}
    container_name: mindmapvault-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 8090
      DB_ENGINE: postgres

      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.deploy}
      POSTGRES_DB: mindmapvault
      POSTGRES_PORT: 5432
      POSTGRES_DSN: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.deploy}@postgres:5432/mindmapvault

      S3_ENDPOINT: http://garage:3900
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env.deploy}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env.deploy}
      S3_BUCKET: ${S3_BUCKET:-mindmapvault}
      S3_BASE_URL: ${S3_BASE_URL:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-garage}
      S3_PRESIGN_EXPIRY_SECS: ${S3_PRESIGN_EXPIRY_SECS:-3600}

      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.deploy}
      JWT_ACCESS_EXPIRY_SECS: ${JWT_ACCESS_EXPIRY_SECS:-900}
      JWT_REFRESH_EXPIRY_SECS: ${JWT_REFRESH_EXPIRY_SECS:-2592000}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?Set ADMIN_API_TOKEN in .env.deploy}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:1420,http://tauri.localhost,https://tauri.localhost}
      RUST_LOG: ${RUST_LOG:-backend=info,tower_http=info}

      # How many credential verifications may run at once. Argon2 is
      # deliberately slow, and the per-address limits are keyed on something a
      # botnet spreads across, so this is what actually bounds the CPU one
      # instance will spend on sign-ins. Empty means "one per core".
      AUTH_VERIFY_CONCURRENCY: ${AUTH_VERIFY_CONCURRENCY:-}

      # The origin browsers reach this server on. Federated sign-in needs it to
      # build a redirect URI that matches the one registered at the identity
      # provider; it cannot be taken from the Host header, which the caller
      # chooses. Leave empty if you are not using SSO.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}

      # Seeds for the instance settings, read only when this database has no
      # settings row yet — the first start of a new deployment. After that the
      # admin console at /admin/ is the one place these change, so editing them
      # here later has no effect. See docs/DEPLOYMENT.md.
      #
      # REGISTRATION_ENABLED     true (default) or false
      # USER_STORAGE_LIMIT_BYTES per-account cap; 0 (default) is unlimited
      # MAX_ATTACHMENT_SIZE_BYTES largest single file; 0 (default) is unlimited
      # TRUSTED_PROXY_CIDRS      comma-separated address ranges your own
      #                          reverse proxy reaches the server from, e.g.
      #                          10.0.0.0/8,192.168.1.5. Only requests from
      #                          these have X-Forwarded-For believed. Empty
      #                          (default) means nothing sits in front.
      #                          Replaces TRUST_PROXY_HEADERS, which trusted
      #                          an entry the caller writes; see
      #                          docs/DEPLOYMENT.md#behind-a-reverse-proxy.
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      USER_STORAGE_LIMIT_BYTES: ${USER_STORAGE_LIMIT_BYTES:-0}
      MAX_ATTACHMENT_SIZE_BYTES: ${MAX_ATTACHMENT_SIZE_BYTES:-0}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      # Read only so an upgraded instance can be warned that it no longer
      # does anything.
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}

      # Filesystem whose free space the Status page reports. The container root
      # normally sits on the same disk as the volumes below, which is the disk
      # that runs out; point this elsewhere if you bind them to another one.
      STATUS_DISK_PATH: ${STATUS_DISK_PATH:-/}
    ports:
      - "8090:8090"

  # A local identity provider for trying federated sign-in out. Not part of a
  # deployment: start it with `--profile sso`.
  #
  # Keycloak rather than Authentik purely because it runs from one container
  # with no database or worker of its own. Any OIDC-compliant provider works —
  # see docs/DEPLOYMENT.md#federated-sign-in-sso.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: mindmapvault-keycloak
    profiles: ["sso"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      # The issuer has to be one string that resolves the same way from the
      # browser and from the server container. host.docker.internal is the only
      # name both agree on without editing the machine's hosts file.
      KC_HOSTNAME: http://host.docker.internal:8095
    volumes:
      - ./docker/keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro
    # Bound to every interface on purpose: host.docker.internal resolves to the
    # host's LAN address, so a loopback-only binding is unreachable. That does
    # put a test identity provider with a published admin password on your
    # network, which is why this sits behind a profile and must never be run
    # anywhere real.
    ports:
      - "8095:8080"

volumes:
  postgres-data:
  garage-meta:
  garage-data:
